name: Generate lockfile

on:
  push:
    branches:
      - feat/core-architecture-v0

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/core-architecture-v0

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Verify runtime toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify and commit lockfile
        run: |
          sha256sum package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add reproducible npm lockfile"
          git push origin HEAD:feat/core-architecture-v0
