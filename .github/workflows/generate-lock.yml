name: Generate lockfile

on:
  push:
    branches:
      - feat/core-architecture-v0

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Verify runtime toolchain
        run: |
          node --version
          test "$(node --version)" = "v24.19.0"
          npm --version
          test "$(npm --version)" = "11.17.0"

      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Report lockfile
        run: |
          sha256sum package-lock.json
          echo '---LOCKFILE-BASE64-BEGIN---'
          base64 -w0 package-lock.json
          echo
          echo '---LOCKFILE-BASE64-END---'
