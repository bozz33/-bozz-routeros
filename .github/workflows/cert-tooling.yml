name: RC2 certification tooling

on:
  push:
    branches:
      - 'cert/**'

permissions:
  contents: read

jobs:
  container-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify certification branch preserves RC2 package content
        env:
          RC_SHA: 8a3cd500aa5013577ca1f8179c916dc7807cf392
        run: |
          git cat-file -e "$RC_SHA^{commit}"
          git merge-base --is-ancestor "$RC_SHA" HEAD
          CHANGED="$(git diff --name-only "$RC_SHA"..HEAD | grep -Ev '^(certification/|\.dockerignore$|\.github/workflows/cert-tooling\.yml$)' || true)"
          if [ -n "$CHANGED" ]; then
            echo 'Certification branch modified RC2 package/source files:' >&2
            echo "$CHANGED" >&2
            exit 1
          fi

      - name: Build digest-pinned certification image
        run: |
          docker build --pull --no-cache \
            --file certification/container/Dockerfile \
            --tag bozz-routeros-cert:rc2 \
            .

      - name: Record image identity
        run: |
          docker image inspect bozz-routeros-cert:rc2 \
            --format 'image_id={{.Id}} created={{.Created}}'

      - name: Validate certification harness syntax
        run: |
          docker run --rm --network none --entrypoint /bin/sh bozz-routeros-cert:rc2 -c '
            set -eu
            find certification -type f -name "*.mjs" -exec node --check {} \;
            find certification -type f -name "*.sh" -exec sh -n {} \;
          '

      - name: Test certification evidence validator
        run: |
          docker run --rm --network none --entrypoint node bozz-routeros-cert:rc2 \
            --test certification/evidence/validate-soak.test.mjs

      - name: Execute package gate without runtime network
        run: docker run --rm --network none bozz-routeros-cert:rc2
